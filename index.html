
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo | Primer Parcial</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #0b1120;
            color: #f8fafc;
        }

        .contenedor {
            width: 100%;
            max-width: 480px;
            padding: 45px 30px;
            background-color: #111c30;
            border: 1px solid #263449;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .icono {
            font-size: 42px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 36px;
            margin: 0 0 18px;
        }

        p {
            color: #94a3b8;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .etiqueta {
            display: inline-block;
            padding: 8px 14px;
            margin-bottom: 25px;
            border-radius: 6px;
            background-color: #1e293b;
            color: #86efac;
            font-size: 13px;
        }

        .boton {
            display: inline-block;
            padding: 13px 24px;
            background-color: #2563eb;
            color: #ffffff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .boton:hover {
            background-color: #1d4ed8;
        }

        footer {
            margin-top: 35px;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main class="contenedor">
        <div class="icono">💻</div>

        <h1>¡Hola, Mundo! 👋</h1>

        <p>
            Mi primera página web para el
            primer parcial de Integración Continua.
        </p>

        <div class="etiqueta">
            ✓ Proyecto en desarrollo
        </div>

        <br>

        <a
            class="boton"
            href="https://github.com/xNeuNoRo"
            target="_blank"
            rel="noopener noreferrer"
        >
            Ver mi GitHub ↗
        </a>

        <footer>
            Electiva 2 · Primer Parcial
        </footer>
    </main>
</body>
</html>
